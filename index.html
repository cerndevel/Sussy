<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SUSSY</title>
<meta name="description" content="Social deduction in your browser. Do tasks, find the imposter. One click to play.">
<meta name="twitter:card" content="{{CARD}}">{{SITE}}
<meta name="twitter:title" content="SUSSY: find the imposter, live with everyone">
<meta name="twitter:description" content="Type a name and you're in. Tasks, vents, sabotage, voting.">
<meta name="twitter:player" content="{{ORIGIN}}/play">
<meta name="twitter:player:width" content="560">
<meta name="twitter:player:height" content="560">
<meta name="twitter:image" content="{{ORIGIN}}/card.png">
<meta name="twitter:image:alt" content="SUSSY: a social deduction game with an alien crew around an emergency button">
<meta property="og:title" content="SUSSY">
<meta property="og:description" content="Social deduction in your browser. One click to play.">
<meta property="og:image" content="{{ORIGIN}}/card.png">
<style>
:root{--ui:#0d1224;--ui2:#171f3b;--line:#3b4777;--txt:#eaf0ff;--dim:#8d99c6;--red:#ef4b3f;--cy:#5ad8ff;--gold:#ffd23f;--grn:#4cd964;--u:clamp(11px,2.3vmin,17px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05060d;color:var(--txt);font:700 var(--u)/1.25 "Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input{font:inherit;color:inherit}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- title ---------- */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:1.2vmin;padding:2vmin;text-align:center;overflow:auto}
#title>:first-child{margin-top:auto}#title>:last-child{margin-bottom:auto}
#logo{margin:0;font-size:clamp(40px,13vmin,120px);line-height:.9;font-weight:900;letter-spacing:-.04em;font-style:italic;color:#fff;-webkit-text-stroke:.05em #0b0f22;paint-order:stroke fill;text-shadow:.04em .06em 0 #c51111,.08em .12em 0 #7a0838,0 .2em .5em rgba(0,0,0,.6)}
#tag{margin:0 0 .4vmin;color:var(--dim);font-size:.92em}
#tbox{display:flex;flex-direction:column;align-items:center;gap:1vmin;background:rgba(13,18,36,.8);border:2px solid var(--line);border-radius:18px;padding:1.6vmin 2.6vmin;backdrop-filter:blur(3px);width:min(92vw,420px)}
#prev{width:clamp(48px,11vmin,84px);height:auto;aspect-ratio:7/8}
#nm{width:100%;padding:.7em .9em;text-align:center;font-size:1.15em;background:#080b18;border:2px solid var(--line);border-radius:12px;outline:none}
#nm:focus{border-color:var(--cy)}
#sw{display:grid;grid-template-columns:repeat(6,1fr);gap:.7vmin;width:100%}
#sw i{aspect-ratio:1;width:100%;max-width:44px;justify-self:center;border-radius:50%;border:3px solid rgba(255,255,255,.18);cursor:pointer;position:relative}
#sw i.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
#play{width:100%;padding:.75em 1em;font-size:1.3em;font-weight:900;letter-spacing:.06em;border:0;border-radius:14px;background:linear-gradient(#f2584b,#c4271c);box-shadow:0 .25em 0 #7a120b,0 .5em 1.2em rgba(0,0,0,.4);text-transform:uppercase}
#play:active{transform:translateY(.12em);box-shadow:0 .12em 0 #7a120b}
#play:disabled{filter:grayscale(.8);opacity:.7}
#onl{color:var(--dim);font-size:.85em}
#onl b{color:var(--grn)}
#help{color:var(--dim);font-size:.74em;line-height:1.5;max-width:420px}
@media (pointer:coarse){#help .kb{display:none}}
#help kbd{background:#1a2342;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .4em;color:#cbd5ff;font:inherit}
#err{color:#ff8a80;min-height:1.2em;font-size:.85em}

/* ---------- hud ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#prog{position:absolute;left:1.4vmin;top:1.4vmin;width:min(46vmin,340px);height:max(3.6vmin,22px);background:rgba(10,14,28,.8);border:2px solid var(--line);border-radius:10px;overflow:hidden}
#pf{height:100%;width:0;background:linear-gradient(#63e676,#25a043);transition:width .5s}
#pt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.7em;letter-spacing:.05em;text-shadow:0 1px 2px #000;text-transform:uppercase}
#tasks{position:absolute;left:1.4vmin;top:calc(max(3.6vmin,22px) + 2.8vmin);width:min(36vmin,270px);background:rgba(10,14,28,.7);border:2px solid var(--line);border-radius:12px;overflow:hidden;font-size:.8em}
#th{padding:.5em .8em;background:rgba(48,62,120,.75);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
#tl div{padding:.3em .8em;border-top:1px solid rgba(255,255,255,.07);line-height:1.2}
#tl div small{display:block;color:var(--dim);font-size:.82em;font-weight:600}
#tl .dn{color:#6fe083}#tl .dn b{text-decoration:line-through;font-weight:700}
#tasks.min #tl{display:none}
#tr{position:absolute;right:1.4vmin;top:1.4vmin;display:flex;gap:1vmin;align-items:center}
#rinfo{color:var(--dim);font-size:.72em;margin-right:.4em;text-shadow:0 1px 2px #000;text-align:right;line-height:1.2}
.sq{width:max(5vmin,34px);height:max(5vmin,34px);border-radius:12px;border:2px solid var(--line);background:rgba(10,14,28,.8);display:flex;align-items:center;justify-content:center;font-size:1.5em}
.sq:active{background:#222c52}
#msg{position:absolute;left:1.6vmin;right:calc(3*clamp(58px,13.5vmin,96px) + 6vmin);bottom:2.4vmin;text-align:center;pointer-events:none!important;text-shadow:0 2px 4px #000,0 0 10px #000;font-size:1.05em;line-height:1.3}
#sabb{position:absolute;left:50%;top:max(6.2vmin,40px);transform:translateX(-50%);padding:.4em 1.2em;border-radius:12px;background:rgba(150,16,16,.88);border:2px solid #ff6b5e;color:#fff;font-size:.95em;text-align:center;pointer-events:none!important;animation:pulse .9s infinite;white-space:nowrap}
@keyframes pulse{50%{background:rgba(220,40,30,.92)}}
@media (max-aspect-ratio:1/1){#msg{right:1.6vmin;bottom:calc(2*clamp(58px,13.5vmin,96px) + 5vmin)}}
#acts{position:absolute;right:1.6vmin;bottom:1.6vmin;display:flex;flex-direction:column;align-items:flex-end;gap:1.1vmin}
#acts>div{display:flex;gap:1.1vmin}
.ab{position:relative;width:clamp(58px,13.5vmin,96px);height:clamp(58px,13.5vmin,96px);border-radius:20px;border:3px solid #4f5d96;background:linear-gradient(#252f58,#151b37);color:#aab6ea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;font-size:.62em;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 .3em .7em rgba(0,0,0,.45)}
.ab svg.i{width:2.6em;height:2.6em;stroke-width:1.8}
.ab.on{border-color:var(--gold);color:#fff;box-shadow:0 0 1.4em rgba(255,210,63,.55),0 .3em .7em rgba(0,0,0,.45)}
.ab.on.k{border-color:var(--red);box-shadow:0 0 1.4em rgba(239,75,63,.65),0 .3em .7em rgba(0,0,0,.45)}
.ab.on.r{border-color:#ff9f1c;box-shadow:0 0 1.4em rgba(255,159,28,.65),0 .3em .7em rgba(0,0,0,.45)}
.ab:not(.on){opacity:.55}
.ab:active{transform:scale(.95)}
.ab .cd{position:absolute;inset:0;border-radius:17px;background:rgba(5,8,18,.7);display:none;align-items:center;justify-content:center;font-size:2.4em;color:#fff}
.ab.cool .cd{display:flex}
#acts>#vnav{display:none}
#acts>#vnav.on{display:flex}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,4,12,.62);z-index:20}
.pn{background:linear-gradient(#141b36,#0c1124);border:3px solid var(--line);border-radius:18px;padding:1.6vmin;box-shadow:0 1em 3em rgba(0,0,0,.6);max-width:96vw;max-height:94vh;overflow:auto}
.ph{display:flex;justify-content:space-between;align-items:center;gap:1em;margin-bottom:1vmin;font-size:1.1em}
.x{border:2px solid var(--line);background:#1b2447;border-radius:10px;width:2em;height:2em;font-size:1em;line-height:1}
#mgb{width:min(88vw,480px);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin;text-align:center}
#mgb canvas{width:100%;max-width:460px;border-radius:12px;background:#080c1a;touch-action:none;display:block}
.bar{width:100%;height:1.6em;background:#080c1a;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(#5ad8ff,#2a8fd0)}
.big{padding:.7em 1.4em;border:0;border-radius:14px;background:linear-gradient(#3b82f6,#1d4fbf);font-size:1.15em;font-weight:900;box-shadow:0 .2em 0 #0f2d78;text-transform:uppercase;letter-spacing:.05em}
.big.red{background:linear-gradient(#f2584b,#c4271c);box-shadow:0 .2em 0 #7a120b}
.big:disabled{opacity:.5}
.note{color:var(--dim);font-size:.85em;min-height:1.3em}
.ok{color:var(--grn)}.bad{color:#ff8a80}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:1vmin;width:100%}
.nums button{aspect-ratio:1;border-radius:14px;border:3px solid #4f5d96;background:linear-gradient(#27315e,#171e3d);font-size:1.6em;font-weight:900}
.nums button.d{background:linear-gradient(#2f9d4b,#1d6a32);border-color:#7be495}
.sw5{display:flex;gap:2vmin;justify-content:center;width:100%}
.sw5 b{width:12vmin;max-width:64px;height:20vmin;max-height:130px;background:#080c1a;border:3px solid var(--line);border-radius:12px;position:relative;cursor:pointer;display:block}
.sw5 b::after{content:"";position:absolute;left:12%;right:12%;height:42%;border-radius:8px;background:linear-gradient(#aab,#778);top:52%;transition:top .12s}
.sw5 b.on::after{top:6%;background:linear-gradient(#8ff0a0,#2fb34e)}
.sw5 b i{position:absolute;top:-.5em;left:50%;width:.9em;height:.9em;margin-left:-.45em;border-radius:50%;background:#733;box-shadow:0 0 0 2px #000}
.sw5 b.on i{background:#4cd964;box-shadow:0 0 .8em #4cd964}
.hexes{display:flex;flex-direction:column;align-items:center;gap:0;margin:.5em 0}
.hexes div{display:flex;gap:.2em;margin-top:-.7em}
.hexes button{width:min(17vmin,92px);aspect-ratio:1.1547;border:0;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:#d8e4ff;transition:background .15s}
.hexes button.off{background:#d63b3b;animation:blink 1s infinite}
@keyframes blink{50%{background:#7a1e1e}}
.rng{display:flex;flex-direction:column;gap:2.4vmin;width:100%}
.rng label{display:flex;align-items:center;gap:1em;text-align:left}
.rng input{flex:1;accent-color:var(--cy);height:2.4em}
.rng .tg{position:absolute}
.hold{width:min(46vmin,200px);aspect-ratio:1;border-radius:50%;border:6px solid #ff6b5e;background:radial-gradient(#ff5a4d,#8e1710);font-size:1.5em;font-weight:900;color:#fff;touch-action:none}
.hold.on{background:radial-gradient(#8bff9a,#1f8a35);border-color:#7be495}

/* ---------- meeting ---------- */
#meet{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 20%,#18214a,#070a16 75%);display:flex;flex-direction:column;padding:1.6vmin;gap:1.1vmin;z-index:30}
#mh{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.5em 1em;background:rgba(36,48,96,.75);border:2px solid var(--line);border-radius:14px}
#mh h2{margin:0;font-size:1.35em}
#mh small{display:block;color:var(--dim);font-size:.72em;font-weight:600}
#mt{font-size:1.25em;color:var(--gold);white-space:nowrap}
#mb{flex:1;min-height:0;display:grid;grid-template-columns:1.2fr 1fr;gap:1.1vmin}
@media (max-aspect-ratio:1/1){#mb{grid-template-columns:1fr;grid-template-rows:1.25fr 1fr}}
#mleft{display:flex;flex-direction:column;gap:.8vmin;min-height:0}
#mcards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:.8vmin;overflow:auto;align-content:start}
.card{position:relative;display:flex;align-items:center;gap:.6em;padding:.25em .7em;background:linear-gradient(#2c3868,#1f294d);border:2px solid #4a5a99;border-radius:12px;cursor:pointer;min-height:max(5vmin,34px);overflow:hidden}
.card img{width:auto;height:max(4.2vmin,28px);flex:none}
.card .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card i{color:var(--dim);font-style:normal;font-size:.75em;font-weight:600}
.card.dead{filter:grayscale(1);opacity:.5;cursor:default}
.card.me{border-color:var(--cy)}
.card.mate .nm{color:#ff6b5e}
.card.sel{border-color:var(--gold);background:linear-gradient(#4a4a2a,#322f18)}
.card .vb{position:absolute;right:.5em;top:50%;transform:translateY(-50%);width:1.6em;height:1.6em;background:#2ea44f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8em}
.cf{display:flex;gap:.3em}
.card .cf{position:absolute;right:.3em;top:50%;transform:translateY(-50%)}
.cf button{width:2.1em;height:2.1em;border:0;border-radius:8px;font-size:.9em;font-weight:900;color:#fff;padding:0}
.cf .y{background:#2ea44f}.cf .n{background:#c0392b}
.card .nm i{margin-left:.3em}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shk{animation:shk .3s}
.card .vs{display:flex;gap:2px;position:absolute;right:.4em;top:50%;transform:translateY(-50%)}
.card .vs img{height:max(2.6vmin,18px)}
.card.call::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
#skip{padding:.5em;border-radius:12px;border:2px solid var(--line);background:#1b2447;display:flex;align-items:center;justify-content:center;gap:.6em;min-height:max(4.4vmin,32px)}
#skip.sel{border-color:var(--gold)}
#skip .vs{display:flex;gap:2px}#skip .vs img{height:max(2.6vmin,18px)}
#mchat{display:flex;flex-direction:column;min-height:0;background:rgba(8,12,26,.75);border:2px solid var(--line);border-radius:14px;padding:.5em}
#cl{flex:1;min-height:0;overflow:auto;font-size:.82em;font-weight:600;line-height:1.3;padding:.2em .4em}
#cl div{padding:.15em 0}
#cl b{margin-right:.4em}
#cf{display:flex;gap:.5em;margin-top:.4em}
#ci{flex:1;min-width:0;padding:.5em .7em;border-radius:10px;border:2px solid var(--line);background:#080b18;outline:none}
#cf button{border:0;border-radius:10px;background:#3b82f6;padding:0 1em;font-weight:900}
#ci:disabled{opacity:.5}
#alert{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse,rgba(120,10,10,.78),rgba(10,0,0,.88));text-align:center;gap:1vmin;animation:slam .35s cubic-bezier(.2,1.6,.4,1)}
#alert h1{margin:0;font-size:clamp(28px,9vmin,80px);font-style:italic;font-weight:900;text-transform:uppercase;-webkit-text-stroke:.04em #000;paint-order:stroke fill;text-shadow:0 .08em 0 #7a0838}
#alert p{margin:0;font-size:1.3em;color:#ffd0cc}
@keyframes slam{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
#flash{position:fixed;inset:0;pointer-events:none;background:#c00;opacity:0;z-index:25;transition:opacity .5s}
#mapov{position:fixed;inset:0;z-index:28;display:flex;align-items:center;justify-content:center;background:rgba(2,4,12,.8)}
#mapc{max-width:96vw;max-height:90vh;border:3px solid var(--line);border-radius:14px;background:#080c1a}
#sabm .big{width:100%;margin-top:1vmin}
#sabm .big small{display:block;font-size:.65em;opacity:.8;font-weight:600;text-transform:none;letter-spacing:0}
#bye{z-index:60;flex-direction:column;gap:1.5vmin;text-align:center}
</style></head>
<body>
<canvas id="c"></canvas>

<div id="title">
  <h1 id="logo">SUSSY</h1>
  <p id="tag">Find the imposter before it's too late.</p>
  <div id="tbox">
    <canvas id="prev" width="168" height="192"></canvas>
    <input id="nm" maxlength="12" placeholder="Your name" autocomplete="off" spellcheck="false">
    <div id="sw"></div>
    <button id="play">Play</button>
    <div id="err"></div>
    <div id="onl">&nbsp;</div>
  </div>
  <div id="help"><span class="kb"><kbd>WASD</kbd> / arrows move · <kbd>E</kbd> use · <kbd>Q</kbd> kill · <kbd>R</kbd> report · <kbd>V</kbd> vent · <kbd>G</kbd> sabotage · <kbd>M</kbd> map<br></span>Touch: drag the left side to move, buttons on the right</div>
</div>

<div id="hud" class="hide">
  <div id="prog"><div id="pf"></div><div id="pt">Crew progress</div></div>
  <div id="tasks"><div id="th"><span id="thx">Tasks</span><span id="thc">▾</span></div><div id="tl"></div></div>
  <div id="tr"><div id="rinfo"></div><button class="sq" id="bmap" title="Map (M)"><svg class="i" viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg></button><button class="sq" id="bsnd" title="Sound"></button></div>
  <div id="sabb" class="hide"></div>
  <div id="msg"></div>
  <div id="acts">
    <div id="vnav"><button class="ab on" id="vprev"><svg class="i" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Prev</button><button class="ab on" id="vnext"><svg class="i" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>Next</button></div>
    <div id="row1">
      <button class="ab k" id="bsab"><svg class="i" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span class="lb">Sabotage</span><span class="cd"></span></button>
      <button class="ab k" id="bvent"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 9h12M6 12h12M6 15h12"/></svg><span id="vl">Vent</span></button>
    </div>
    <div id="row2">
      <button class="ab r" id="brep"><svg class="i" viewBox="0 0 24 24"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>Report</button>
      <button class="ab k" id="bkill"><svg class="i" viewBox="0 0 24 24"><path d="M5 20 L10 15"/><path d="M10 15 L19 4 L21 8 L13 17 Z"/><path d="M8 13 l3 3"/></svg><span class="lb">Kill</span><span class="cd"></span></button>
      <button class="ab" id="buse"><svg class="i" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg><span class="lb">Use</span></button>
    </div>
  </div>
</div>

<div id="flash"></div>
<div id="alert" class="hide"></div>

<div id="meet" class="hide">
  <div id="mh"><div><h2 id="mtitle">Who is the Imposter?</h2><small id="msub"></small></div><div id="mt"></div></div>
  <div id="mb">
    <div id="mleft"><div id="mcards"></div><div id="skip"></div></div>
    <div id="mchat"><div id="cl"></div><div id="cf"><input id="ci" maxlength="80" placeholder="Say something…" autocomplete="off"><button id="cs">Send</button></div></div>
  </div>
</div>

<div id="mg" class="ov hide"><div class="pn"><div class="ph"><b id="mgt">Task</b><button class="x" id="mgx">✕</button></div><div id="mgb"></div></div></div>
<div id="sabm" class="ov hide"><div class="pn" style="width:min(86vw,360px)"><div class="ph"><b>Sabotage</b><button class="x" id="sabx">✕</button></div><div id="sabc"></div></div></div>
<div id="mapov" class="hide"><canvas id="mapc"></canvas></div>
<div id="bye" class="ov hide"></div>

<script>
'use strict';
/* ============================================================
   SUSSY client — core: constants, audio, state, network, input
   ============================================================ */
const $ = id => document.getElementById(id);
